const FACT=['بداية الدورة: يبدأ الحيض وتتجدد بطانة الرحم، ويُحسب عمر الحمل من أول يوم لآخر دورة، فلا يوجد حمل فعلي بعد.','تنضج بويضة داخل المبيض وتحدث الإباضة غالباً نحو اليوم 14، وتبقى البويضة قابلة للإخصاب 12–24 ساعة فقط.','ينقسم البويض المخصّب بسرعة ويصل الرحم على شكل كيسة أريمية ثم يبدأ الانغراس في بطانة الرحم.','ينغرس الجنين في بطانة الرحم ويبدأ هرمون الحمل hCG بالظهور في الدم والبول وتتكوّن المشيمة الأولى.','يبدأ الأنبوب العصبي بالتكوّن وهو أصل الدماغ والحبل الشوكي، ويتكوّن قلب بدائي على شكل أنبوب.','يبدأ القلب بالنبض بإيقاع منتظم ويمكن رؤيته بالسونار، وتظهر براعم الذراعين والساقين.','تتشكل ملامح الوجه الأولى (العينان والأنف) وينقسم الدماغ إلى مناطقه الرئيسية.','تتكوّن الأصابع وتبدأ حركات عفوية صغيرة، ويصل نبض القلب إلى نحو 150–170 نبضة في الدقيقة.','تتضح الجفون والأذنان وتنمو العضلات، وتبدأ الغضاريف بالتحول تدريجياً إلى عظام.','تنتهي مرحلة تكوّن الأعضاء الأساسية ويدخل الجنين مرحلة النمو، وتختفي الأغشية بين الأصابع.','يبدأ الجنين بتحريك أطرافه بنشاط، وتتكوّن الأظافر وتتمايز الأعضاء التناسلية الخارجية.','تعمل الكلى وتنتج البول، ويستجيب الجنين للمس، ويُجرى فحص الشفافية القفوية بين الأسبوع 11 و14.','تتكوّن بصمات الأصابع وتنمو الأحبال الصوتية، ويقترب نهاية الثلث الأول.','يبدأ الجنين بتعابير الوجه، ويغطي جلده شعر ناعم (اللانوغو)، وينشط جهازه الهضمي.','تقوى العظام وتتكوّن براعم التذوق، ويستطيع الجنين البلع والتحرك بحرية في السائل الأمنيوسي.','يكبر الهيكل العظمي وتتحسن حركات الجنين، وقد تشعر الأم بأولى الحركات خاصة إن سبق لها الحمل.','تتكوّن الدهون البنية التي تساعده على التدفئة بعد الولادة، وتنمو المشيمة بسرعة.','تتطور عظام الأذن الوسطى ويبدأ السمع، وتُغلَّف الأعصاب بغمد الميالين.','يغطي جلده طبقة دهنية واقية تسمى الفيرنكس تحميه من السائل الأمنيوسي.','منتصف الحمل: يُجرى سونار التشريح بين الأسبوع 18 و22 لفحص نمو الأعضاء.','تنشط حركات الجنين ويبدأ نخاع العظم بالمشاركة في إنتاج خلايا الدم.','تتكوّن الحواجب والرموش وتتطور حاسة اللمس، وقد يمسك الحبل السري بيديه.','يتفاعل مع الأصوات العالية ويتحرك استجابة لها، وتنمو الأوعية الدموية في رئتيه.','تتشكل الحويصلات الهوائية في الرئتين ويبدأ إنتاج السرفاكتانت؛ ويُجرى فحص سكر الحمل بين 24 و28.','تتحسن استجابة الجنين للصوت واللمس وتنضج الأوعية الدموية في الرئتين.','تنفتح الجفون ويستجيب الجنين للضوء الساطع.','يزداد نشاط الدماغ وتظهر تلافيفه، وتنتظم دورات النوم واليقظة، وينتهي الثلث الثاني تقريباً.','يبدأ الثلث الثالث: يتراكم الدهن تحت الجلد ويرمش الجنين، ويُفحص عامل Rh عند الحاجة.','تقوى عظامه ويحتاج لكميات أكبر من الكالسيوم والحديد من الأم.','يزداد حجم الدماغ ويتحسن تحكمه بحرارة جسمه.','تنضج الوصلات العصبية وتبدأ المشيمة بنقل كميات أكبر من الأجسام المضادة من الأم.','تتدرب الرئتان على التنفس ويتخذ الجنين غالباً وضعية الرأس للأسفل.','تستمر المناعة بالنمو عبر الأجسام المضادة المنقولة من الأم، ويزداد وزنه بسرعة.','يصل السائل الأمنيوسي إلى أعلى مستوى تقريباً وتنضج الرئتان تدريجياً.','تنضج الكلى وتقل مساحة الحركة لكن الحركات لا تتوقف؛ استمري بعدّها يومياً.','ينزل رأس الجنين غالباً نحو الحوض، ويُجرى فحص GBS بين الأسبوع 36 و37.','يُعدّ الحمل مكتمل المدة مبكراً من هذا الأسبوع، وتتجمع مادة العقي في أمعائه.','يزداد الدهن الواقي ويتساقط جزء من اللانوغو، وتستمر الرئتان بالنضج.','يُسمّى الحمل مكتمل المدة بين الأسبوع 39 و40، والجنين جاهز للولادة.','موعد الولادة المتوقع؛ نسبة قليلة (نحو 4–5%) تلد في الموعد بالضبط وأغلب الولادات بين 37 و42.'];
const DET=[[3,'يُحسب عمر الحمل من أول يوم لآخر دورة، لذلك يمر الأسبوعان الأولان قبل الإخصاب فعلياً. تنضج البويضة وتُطلق عند الإباضة وتبقى قابلة للإخصاب نحو 12–24 ساعة، بينما تعيش الحيوانات المنوية حتى 5 أيام. بعد الإخصاب تنقسم الخلايا بسرعة مكوّنة كرة خلايا تصل الرحم خلال نحو 5 أيام.'],[5,'تتمايز الخلايا إلى ثلاث طبقات: الخارجية (الجلد والجهاز العصبي)، والوسطى (القلب والعضلات والعظام والكلى)، والداخلية (الأمعاء والكبد والرئتان). تبدأ الصفيحة العصبية بالانطواء لتكوّن الأنبوب العصبي، ويتكوّن أنبوب قلبي بسيط، وتتكوّن المشيمة ويفرز الجسم هرمون hCG.'],[7,'ينبض القلب بإيقاع منتظم ثم ينقسم إلى حجرات، ويتضح انقسام الدماغ إلى مناطق رئيسية. تظهر براعم العينين والأذنين والأنف، وتتكوّن براعم الأطراف. يكتمل غلق الأنبوب العصبي تقريباً في هذه الفترة، ولهذا يُوصى بحمض الفوليك قبل الحمل وفي بدايته.'],[9,'تتكوّن الأصابع وتنفصل تدريجياً، وتنمو الجفون والأذنان، ويبدأ الجنين بحركات عفوية صغيرة لا تشعر بها الأم. يرتفع نبض القلب إلى نحو 150–170 نبضة في الدقيقة ثم يهدأ لاحقاً. تتشكل الكلى والكبد والأمعاء الأساسية وتبدأ العظام بالتكلس.'],[12,'تنتهي فترة تكوّن الأعضاء الرئيسية وتبدأ مرحلة النمو. تتطور الأعصاب والعضلات فتظهر ردود فعل كقبض اليد، وتبدأ الكلى بإنتاج البول. تظهر براعم الأسنان اللبنية داخل الفكين، وتبدأ الأعضاء التناسلية الخارجية بالتمايز، وتتكوّن خلايا الدم في الكبد.'],[15,'ينمو الدماغ بسرعة وتتشكل الوصلات العصبية الأولى. يبدأ الجنين بالبلع والتحرك بنشاط، وتتكوّن براعم التذوق. تغطي الجلد شعيرات ناعمة (اللانوغو)، وتتشكل بصمات الأصابع، وتزداد قوة العظام.'],[18,'يتحسن تنسيق الحركات وقد تشعر الأم بالركلات الخفيفة. تتطور العظام الصغيرة في الأذن الوسطى فيبدأ السمع، وتتكوّن الدهون البنية التي تساعد على التدفئة بعد الولادة، ويبدأ غمد الميالين بتغليف الأعصاب لتسريع الإشارات.'],[21,'يتغطى الجلد بالفيرنكس الدهني الواقي، وتنمو الحواجب والرموش وشعر الرأس. تتطور الحواس: يسمع الأصوات الخارجية ويتحسس اللمس، وتنشط الدورة الدموية ويبدأ نخاع العظم بالمشاركة في إنتاج خلايا الدم.'],[24,'تنمو الشعب الهوائية وتتكوّن الحويصلات الهوائية في الرئتين ويبدأ إنتاج السرفاكتانت. يتفاعل الجنين مع الأصوات والضوء الساطع ويتحسن توازنه، ويصبح البقاء ممكناً بالرعاية المركزة من نحو الأسبوع 22–24.'],[27,'تزداد تلافيف الدماغ وينشط نموه وتتنظم دورات النوم واليقظة. تنفتح الجفون ويرمش الجنين، وتنضج الأوعية الدموية في الرئتين وتتحسن حركات التنفس التدريبية.'],[31,'تتراكم الدهون تحت الجلد فيمتلئ الجسم ويتحسن ضبط حرارته. تنضج المسارات العصبية والبصرية فيستجيب للضوء، ويبدأ انتقال الأجسام المضادة من الأم عبر المشيمة لتحميه بعد الولادة. تقوى العظام وتحتاج الأم لكالسيوم كافٍ.'],[35,'تتدرب الرئتان على التنفس وتزداد كمية السرفاكتانت، ويصل السائل الأمنيوسي ذروته تقريباً. يزداد وزن الجنين بنحو 200 غ أسبوعياً وينمو الدماغ بسرعة، وتنتقل كميات أكبر من الأجسام المضادة من الأم، وتنضج الكلى.'],[37,'ينزل الرأس غالباً نحو الحوض وتتجمع في الأمعاء مادة العقي. تتكوّن الأظافر الكاملة ويزداد الدهن الواقي. من الأسبوع 37 يُعدّ الحمل مكتمل المدة مبكراً.'],[40,'تقترب الرئتان والدماغ من الجاهزية لكنهما يواصلان النضج بعد الولادة. يتساقط معظم اللانوغو ويقل الفيرنكس ويستمر انتقال الأجسام المضادة. استمري بعدّ الحركات واذهبي للمستشفى عند علامات الولادة.']];

let _k=null,_ki=0,_ky=1,_kc=0,_km='';
