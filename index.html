function mkS(r){const o={ps:r.ps&&r.ps.length?r.ps:[{lmp:r.lmp||'',visits:r.visits||[]}],cur:r.cur||0};o.ps.forEach(p=>{p.visits=p.visits||[];if(p.set===undefined)p.set=!!p.lmp&&!(p.lmp==='2026-08-30'&&!p.visits.length)});if(o.cur>=o.ps.length)o.cur=0;
Object.defineProperty(o,'lmp',{get:()=>o.ps[o.cur].lmp,set:v=>{o.ps[o.cur].lmp=v}});Object.defineProperty(o,'visits',{get:()=>o.ps[o.cur].visits,set:v=>{o.ps[o.cur].visits=v}});return o}

const FACT=['بداية الدورة: يبدأ الحيض وتتجدد بطانة الرحم، ويُحسب عمر الحمل من أول يوم لآخر دورة، فلا يوجد حمل فعلي بعد.','تنضج بويضة داخل المبيض وتحدث الإباضة غالباً نحو اليوم 14، وتبقى البويضة قابلة للإخصاب 12–24 ساعة فقط.','ينقسم البويض المخصّب بسرعة ويصل الرحم على شكل كيسة أريمية ثم يبدأ الانغراس في بطانة الرحم.','ينغرس الجنين في بطانة الرحم ويبدأ هرمون الحمل hCG بالظهور في الدم والبول وتتكوّن المشيمة الأولى.','يبدأ الأنبوب العصبي بالتكوّن وهو أصل الدماغ والحبل الشوكي، ويتكوّن قلب بدائي على شكل أنبوب.','يبدأ القلب بالنبض بإيقاع منتظم ويمكن رؤيته بالسونار، وتظهر براعم الذراعين والساقين.','تتشكل ملامح الوجه الأولى (العينان والأنف) وينقسم الدماغ إلى مناطقه الرئيسية.','تتكوّن الأصابع وتبدأ حركات عفوية صغيرة، ويصل نبض القلب إلى نحو 150–170 نبضة في الدقيقة.','تتضح الجفون والأذنان وتنمو العضلات، وتبدأ الغضاريف بالتحول تدريجياً إلى عظام.','تنتهي مرحلة تكوّن الأعضاء الأساسية ويدخل الجنين مرحلة النمو، وتختفي الأغشية بين الأصابع.','يبدأ الجنين بتحريك أطرافه بنشاط، وتتكوّن الأظافر وتتمايز الأعضاء التناسلية الخارجية.','تعمل الكلى وتنتج البول، ويستجيب الجنين للمس، ويُجرى فحص الشفافية القفوية بين الأسبوع 11 و14.','تتكوّن بصمات الأصابع وتنمو الأحبال الصوتية، ويقترب نهاية الثلث الأول.','يبدأ الجنين بتعابير الوجه، ويغطي جلده شعر ناعم (اللانوغو)، وينشط جهازه الهضمي.','تقوى العظام وتتكوّن براعم التذوق، ويستطيع الجنين البلع والتحرك بحرية في السائل الأمنيوسي.','يكبر الهيكل العظمي وتتحسن حركات الجنين، وقد تشعر الأم بأولى الحركات خاصة إن سبق لها الحمل.','تتكوّن الدهون البنية التي تساعده على التدفئة بعد الولادة، وتنمو المشيمة بسرعة.','تتطور عظام الأذن الوسطى ويبدأ السمع، وتُغلَّف الأعصاب بغمد الميالين.','يغطي جلده طبقة دهنية واقية تسمى الفيرنكس تحميه من السائل الأمنيوسي.','منتصف الحمل: يُجرى سونار التشريح بين الأسبوع 18 و22 لفحص نمو الأعضاء.','تنشط حركات الجنين ويبدأ نخاع العظم بالمشاركة في إنتاج خلايا الدم.','تتكوّن الحواجب والرموش وتتطور حاسة اللمس، وقد يمسك الحبل السري بيديه.','يتفاعل مع الأصوات العالية ويتحرك استجابة لها، وتنمو الأوعية الدموية في رئتيه.','تتشكل الحويصلات الهوائية في الرئتين ويبدأ إنتاج السرفاكتانت؛ ويُجرى فحص سكر الحمل بين 24 و28.','تتحسن استجابة الجنين للصوت واللمس وتنضج الأوعية الدموية في الرئتين.','تنفتح الجفون ويستجيب الجنين للضوء الساطع.','يزداد نشاط الدماغ وتظهر تلافيفه، وتنتظم دورات النوم واليقظة، وينتهي الثلث الثاني تقريباً.','يبدأ الثلث الثالث: يتراكم الدهن تحت الجلد ويرمش الجنين، ويُفحص عامل Rh عند الحاجة.','تقوى عظامه ويحتاج لكميات أكبر من الكالسيوم والحديد من الأم.','يزداد حجم الدماغ ويتحسن تحكمه بحرارة جسمه.','تنضج الوصلات العصبية وتبدأ المشيمة بنقل كميات أكبر من الأجسام المضادة من الأم.','تتدرب الرئتان على التنفس ويتخذ الجنين غالباً وضعية الرأس للأسفل.','تستمر المناعة بالنمو عبر الأجسام المضادة المنقولة من الأم، ويزداد وزنه بسرعة.','يصل السائل الأمنيوسي إلى أعلى مستوى تقريباً وتنضج الرئتان تدريجياً.','تنضج الكلى وتقل مساحة الحركة لكن الحركات لا تتوقف؛ استمري بعدّها يومياً.','ينزل رأس الجنين غالباً نحو الحوض، ويُجرى فحص GBS بين الأسبوع 36 و37.','يُعدّ الحمل مكتمل المدة مبكراً من هذا الأسبوع، وتتجمع مادة العقي في أمعائه.','يزداد الدهن الواقي ويتساقط جزء من اللانوغو، وتستمر الرئتان بالنضج.','يُسمّى الحمل مكتمل المدة بين الأسبوع 39 و40، والجنين جاهز للولادة.','موعد الولادة المتوقع؛ نسبة قليلة (نحو 4–5%) تلد في الموعد بالضبط وأغلب الولادات بين 37 و42.'];
const DET=[[3,'يُحسب عمر الحمل من أول يوم لآخر دورة، لذلك يمر الأسبوعان الأولان قبل الإخصاب فعلياً. تنضج البويضة وتُطلق عند الإباضة وتبقى قابلة للإخصاب نحو 12–24 ساعة، بينما تعيش الحيوانات المنوية حتى 5 أيام. بعد الإخصاب تنقسم الخلايا بسرعة مكوّنة كرة خلايا تصل الرحم خلال نحو 5 أيام.'],[5,'تتمايز الخلايا إلى ثلاث طبقات: الخارجية (الجلد والجهاز العصبي)، والوسطى (القلب والعضلات والعظام والكلى)، والداخلية (الأمعاء والكبد والرئتان). تبدأ الصفيحة العصبية بالانطواء لتكوّن الأنبوب العصبي، ويتكوّن أنبوب قلبي بسيط، وتتكوّن المشيمة ويفرز الجسم هرمون hCG.'],[7,'ينبض القلب بإيقاع منتظم ثم ينقسم إلى حجرات، ويتضح انقسام الدماغ إلى مناطق رئيسية. تظهر براعم العينين والأذنين والأنف، وتتكوّن براعم الأطراف. يكتمل غلق الأنبوب العصبي تقريباً في هذه الفترة، ولهذا يُوصى بحمض الفوليك قبل الحمل وفي بدايته.'],[9,'تتكوّن الأصابع وتنفصل تدريجياً، وتنمو الجفون والأذنان، ويبدأ الجنين بحركات عفوية صغيرة لا تشعر بها الأم. يرتفع نبض القلب إلى نحو 150–170 نبضة في الدقيقة ثم يهدأ لاحقاً. تتشكل الكلى والكبد والأمعاء الأساسية وتبدأ العظام بالتكلس.'],[12,'تنتهي فترة تكوّن الأعضاء الرئيسية وتبدأ مرحلة النمو. تتطور الأعصاب والعضلات فتظهر ردود فعل كقبض اليد، وتبدأ الكلى بإنتاج البول. تظهر براعم الأسنان اللبنية داخل الفكين، وتبدأ الأعضاء التناسلية الخارجية بالتمايز، وتتكوّن خلايا الدم في الكبد.'],[15,'ينمو الدماغ بسرعة وتتشكل الوصلات العصبية الأولى. يبدأ الجنين بالبلع والتحرك بنشاط، وتتكوّن براعم التذوق. تغطي الجلد شعيرات ناعمة (اللانوغو)، وتتشكل بصمات الأصابع، وتزداد قوة العظام.'],[18,'يتحسن تنسيق الحركات وقد تشعر الأم بالركلات الخفيفة. تتطور العظام الصغيرة في الأذن الوسطى فيبدأ السمع، وتتكوّن الدهون البنية التي تساعد على التدفئة بعد الولادة، ويبدأ غمد الميالين بتغليف الأعصاب لتسريع الإشارات.'],[21,'يتغطى الجلد بالفيرنكس الدهني الواقي، وتنمو الحواجب والرموش وشعر الرأس. تتطور الحواس: يسمع الأصوات الخارجية ويتحسس اللمس، وتنشط الدورة الدموية ويبدأ نخاع العظم بالمشاركة في إنتاج خلايا الدم.'],[24,'تنمو الشعب الهوائية وتتكوّن الحويصلات الهوائية في الرئتين ويبدأ إنتاج السرفاكتانت. يتفاعل الجنين مع الأصوات والضوء const TIPS=[[
'ابدئي يومكِ بوجبة إفطار متوازنة، وتناولي حمض الفوليك كما وصفه طبيبكِ.','الخضروات الورقية كالسبانخ غنية بالفولات؛ أضيفيها إلى وجباتكِ اليوم.','اشربي الماء بانتظام (نحو 8 أكواب يومياً) فهو يدعم الدورة الدموية.','اطهي اللحوم والبيض جيداً وتجنبي النيء منها لحماية جنينكِ من العدوى.','الوجبات الصغيرة المتكررة تخفف الغثيان؛ لا تتركي معدتكِ فارغة طويلاً.','بسكويت مملح قبل النهوض صباحاً قد يخفف غثيان الصباح.','الزنجبيل في الشاي قد يريح المعدة؛ استشيري طبيبكِ إن اشتد الغثيان.','الحبوب الكاملة كالشوفان تمنحكِ طاقة وألياف تقلل الإمساك.','اجعلي في كل وجبة مصدر بروتين: بيض مطبوخ أو بقوليات أو لبن أو دجاج.','تناولي الفواكه الطازجة بعد غسلها جيداً؛ فهي ألياف وفيتامينات.','الكالسيوم لعظام جنينكِ: حليب أو لبن أو جبن مبستر.','الحديد مع فيتامين C يُمتص أفضل: العدس مع عصير الليمون.','نوّعي طعامكِ ولا تعتمدي على صنف واحد؛ التنوع يمدّ جنينكِ بكل ما يحتاجه.','المكسرات غير المملحة وجبة خفيفة غنية بالدهون الصحية.','الأسماك المطبوخة كالسلمون مصدر أوميغا 3؛ تجنبي الأسماك عالية الزئبق كالقرش.','قلّلي الكافيين إلى أقل من 200 ملغ يومياً (كوب إلى كوبين صغيرين من القهوة).','الخضروات الملونة تمنحكِ مضادات الأكسدة؛ اجعلي طبقكِ ملوناً.','التمر باعتدال مصدر طاقة وألياف، وخففيه إن كان سكركِ مرتفعاً.','تجنبي الأجبان الطرية غير المبسترة والأطعمة المعلبة المشكوك فيها.','منتصف الحمل: تزداد حاجتكِ للبروتين والحديد والكالسيوم، فنوّعي وجباتكِ.','قلّلي الملح إن لاحظتِ تورماً، وأكثري من شرب الماء.','الماء والألياف أفضل حليف ضد الإمساك والبواسير.','اختاري الفاكهة بدل الحلويات المصنعة لتحافظي على توازن سكر الدم.','فحص سكر الحمل يقترب (24–28 أسبوعاً): خففي السكريات المكررة والمشروبات المحلاة.','السبانخ والعدس مع الليمون يدعمان مخزون الحديد مع نمو جنينكِ.','قسّمي طعامكِ إلى وجبات صغيرة لأن الرحم بدأ يضغط على المعدة.','حرقة المعدة؟ تجنبي الأطعمة الحارة والدسمة وكلي ببطء.','الثلث الثالث: الكالسيوم والحديد مهمان؛ ناقشي طبيبكِ في المكملات المناسبة.','زيت الزيتون والأفوكادو دهون صحية تدعم نمو دماغ جنينكِ.','اشربي السوائل؛ الجفاف قد يسبب دواراً وانقباضات.','الألياف والماء ثم المشي الخفيف: أفضل وصفة ضد الإمساك.','وجبة خفيفة بين الوجبات: زبادي مع فاكهة.','حافظي على البروتين؛ فنمو جنينكِ سريع في هذه الأسابيع.','تجنبي الوجبات الثقيلة ليلاً لتنامي أفضل.','التمر باعتدال في الأسابيع الأخيرة يمدّكِ بالطاقة، ما لم يمنعكِ الطبيب لسكر الحمل.','وجبات صغيرة خفيفة وسهلة الهضم تناسب هذه المرحلة.','ضعي في حقيبة المستشفى وجبات خفيفة وماء لما بعد الولادة.','الأطعمة الخفيفة والسوائل تمنحكِ طاقة؛ لا تدعي الجوع يرهقكِ.','استمري بالماء والبروتين، وكلي بهدوء.','حافظي على السوائل والطاقة؛ وإن بدأت الولادة فاتبعي إرشادات فريقكِ الطبي عن الأكل.'
],[
'المشي 20–30 دقيقة يومياً يحسّن مزاجكِ وصحة قلبكِ.','الحركة المعتدلة آمنة غالباً في الحمل الطبيعي؛ استشيري طبيبكِ قبل أي برنامج جديد.','مدّي جسمكِ بحركات تمدد لطيفة صباحاً لتنشيط الدورة الدموية.','التعب؟ مشي هادئ قصير أفضل من الراحة الطويلة جداً.','تمارين التنفس العميق تهدئ الغثيان والتوتر.','تمارين كيجل تقوي عضلات الحوض وتفيد في الولادة؛ ابدئي بـ 10 مرات.','يوغا الحوامل تحسّن المرونة والاسترخاء.','السباحة تخفف الضغط عن المفاصل وتناسب معظم الحوامل.','حافظي على ظهر مستقيم أثناء الجلوس لتقليل آلام الظهر.','ارتدي حذاءً مريحاً ثابتاً أثناء المشي.','تجنبي الرياضات العنيفة أو التي تعرضكِ للسقوط أو الضربات.','اشربي الماء قبل الحركة وبعدها لتجنب الجفاف.','تمرين تدوير الحوض يريح أسفل الظهر؛ كرريه 10 مرات.','امشي في الأوقات المعتدلة وتجنبي الحر الشديد.','تمارين تمديد الساقين تقلل التشنجات الليلية.','استمعي لجسمكِ: توقفي فوراً عند الدوار أو الألم أو ضيق النفس.','القرفصاء الخفيف بدعم يقوي عضلات الفخذ والحوض.','تجنبي الاستلقاء على الظهر لفترات طويلة بعد منتصف الحمل.','المشي المعتدل يقرّبكِ من هدف نحو 150 دقيقة أسبوعياً.','ضعي وسادة تحت الركبتين أثناء الراحة لتخفيف ضغط الظهر.','تمرين القطة والبقرة على اليدين والركبتين يخفف ألم الظهر.','انهضي من الجلوس ببطء لتجنب الدوار.','كرة الولادة تريح الحوض؛ اجلسي عليها بدعم لدقائق.','مركز ثقل جسمكِ يتغير، فتجنبي الأسطح الزلقة وحافظي على اتزانكِ.','واظبي على تمارين كيجل والتنفس لتهيئة جسمكِ للولادة.','مشي قصير بعد الوجبات يساعد في ضبط سكر الدم.','تمدد خفيف للرقبة والكتفين يخفف توتر الجلوس الطويل.','ارفعي قدميكِ عند الجلوس لتقليل التورم.','المشي وحركات الحوض اللطيفة تساعد الجنين على الاستقرار.','خذي فترات راحة بين النشاطات؛ طاقتكِ أقل الآن وهذا طبيعي.','المشي في الماء يخفف ثقل الحمل.','تجنبي رفع الأشياء الثقيلة، وانحني من الركبتين لا من الظهر.','تنفس الولادة العميق 5 دقائق يومياً تدريب مفيد.','المشي الهادئ القصير بصحبة مرافق أفضل من المشي وحدكِ.','تمدد الحوض بوضع الجلوس المتربع لطيف إن كان مريحاً.','اخرجي لنسيم لطيف إن سمح الطقس؛ فالحركة الخفيفة مفيدة.','قد يساعد المشي على نزول رأس الجنين؛ امشي بقدر راحتكِ.','حركة خفيفة وراحة متوازنة؛ لا تجهدي
