<script>
const $=s=>document.querySelector(s);
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'],pn=i=>i<10?'الحمل '+ORD[i]:'الحمل رقم '+(i+1);
function mkS(r){const o={ps:r.ps&&r.ps.length?r.ps:[{lmp:'',visits:r.visits||[]}],cur:r.cur||0};o.ps.forEach(p=>{p.visits=p.visits||[]});if(o.cur>=o.ps.length)o.cur=0;
Object.defineProperty(o,'lmp',{get:()=>o.ps[o.cur].lmp,set:v=>{o.ps[o.cur].lmp=v}});Object.defineProperty(o,'visits',{get:()=>o.ps[o.cur].visits,set:v=>{o.ps[o.cur].visits=v}});return o}
let S;try{S=mkS(JSON.parse(localStorage.getItem('mahana')||'{}'))}catch(e){S=mkS({})}
const save=()=>{try{localStorage.setItem('mahana',JSON.stringify(S))}catch(e){}};
let tab=0;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{if(!d)return null;const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const D=d=>d?d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear():'لم يحدد بعد';

const TR=[{n:'الثلث الأول (1–13)',tips:['أكثري من السوائل وتناولي وجبات صغيرة متكررة لتخفيف الغثيان.','تجنبي الكحول والتدخين واللحوم النيئة والأجبان غير المبسترة.','الراحة الكافية، وتجنبي الإفراط في الكافيين (أقل من 200 ملغ يومياً).'],meds:['حمض الفوليك (400–800 ميكروغرام يومياً عادةً) لتقليل عيوب الأنبوب العصبي.','فيتامينات ما قبل الولادة حسب توصية الطبيب.','فيتامين B6 قد يخفف الغثيان بإشراف الطبيب.'],warn:['نزيف مهبلي أو ألم شديد بالبطن','قيء مستمر لا تستطيعين معه شرب السوائل','حرارة مرتفعة']},{n:'الثلث الثاني (14–27)',tips:['ممارسة المشي أو السباحة الخفيفة بانتظام.','نامي على جانبك الأيسر وبوسائد تدعم البطن.','زيدي الأطعمة الغنية بالحديد والكالسيوم والبروتين.'],meds:['مكمل الحديد إذا ظهر نقص في فحص الدم.','الكالسيوم وفيتامين د حسب التحليل.','الباراسيتامول عادةً آمن بالجرعات الموصى بها؛ تجنبي الإيبوبروفين والأسبرين إلا بوصفة طبيب.'],warn:['صداع شديد مع تشوش الرؤية أو تورم مفاجئ بالوجه','نزول سوائل أو انقباضات منتظمة مبكرة','قلة حركة الجنين الملحوظة']},{n:'الثلث الثالث (28–40)',tips:['عدّي حركات الجنين يومياً (10 حركات خلال ساعتين).','جهزي حقيبة الولادة وخطة الوصول للمستشفى.','تمارين التنفس والاسترخاء، ورفع القدمين عند التورم.'],meds:['استمرار الحديد والكالسيوم حسب نتائج التحاليل.','قد يُعطى مضاد حيوي أثناء الولادة إذا كان فحص GBS إيجابياً.','لا تتناولي أي دواء جديد دون استشارة الطبيب.'],warn:['انخفاض أو توقف حركة الجنين','نزيف أو نزول ماء','ألم أعلى البطن وارتفاع الضغط']}];
const trOf=w=>w<14?0:w<28?1:2;
const VIS=[[6,'أول زيارة وتأكيد الحمل (فحص دم وبول وسونار)'],[12,'فحص الشفافية القفوية'],[16,'فحص الرباعي (الكوادرابل) وقياس الضغط'],[20,'سونار التشريح (فحص العيوب الخَلقية)'],[24,'فحص سكر الحمل (الجلوكوز)'],[28,'عامل Rh ومضاد D إن لزم، وتحليل فقر الدم'],[32,'سونار متابعة النمو'],[36,'مسحة GBS وتحديد وضع الجنين'],[38,'فحص أسبوعي'],[40,'موعد الولادة']];

function pregInfo(){
    if(!S.lmp){
        return {days:0,w:0,d:0,due:null,left:280,unset:true};
    }
    const lmpDate = pd(S.lmp);
    if(!lmpDate || isNaN(lmpDate.getTime())){
        return {days:0,w:0,d:0,due:null,left:280,unset:true};
    }
    const diff = today() - lmpDate;
    const dd = Math.max(0, Math.floor(diff / 864e5));
    return {days:dd, w:Math.floor(dd/7), d:dd%7, due:add(lmpDate, 280), left:Math.max(0, 280-dd), unset:false};
}

const BD=[[8,'يبدأ القلب بالنبض نحو الأسبوع 6، وتتكوّن معظم الأعضاء الأساسية بحلول الأسبوع 8، وهي الفترة الأكثر حساسية للأدوية والعوامل الضارة.',['غثيان وقيء صباحي','إرهاق ونعاس شديد','كثرة التبول وحساسية الثدي'],['تناولي حمض الفوليك يومياً (400 ميكروغرام على الأقل).','تجنّبي الكحول والتدخين وأي دواء دون استشارة الطبيب.','احجزي أول زيارة وسونار لتأكيد الحمل وموعد الولادة.']],
[13,'بنهاية الأسبوع 12 تقريباً تكتمل الأعضاء الأساسية، وتبدأ الكلى بإنتاج البول، ويستطيع الجنين فتح قبضته وإغلاقها.',['غثيان يخف تدريجياً','تقلبات مزاجية','إمساك وانتفاخ'],['وجبات صغيرة متكررة وسوائل كافية.','أجري فحص الشفافية القفوية بين الأسبوع 11 و14.','تجنّبي اللحوم والبيض النيئة والأجبان غير المبسترة.']],
[19,'يبدأ الجنين بالبلع وتتكوّن بصمات الأصابع، وتشعر الأم عادةً بأولى الحركات بين الأسبوع 16 و25.',['عودة الطاقة وتحسّن الغثيان','احتقان الأنف ونزيف اللثة الخفيف','ألم خفيف في جانبي أسفل البطن'],['خذي الحديد والكالسيوم حسب نتائج التحاليل.','مارسي نشاطاً معتدلاً (نحو 150 دقيقة أسبوعياً) إن لم يمنعك الطبيب.','أجري فحص الدم الرباعي في الموعد الذي يحدده الطبيب.']],
[27,'يبدأ الجنين بسماع الأصوات وتتكوّن الحويصلات الهوائية في رئتيه، ويصبح البقاء ممكناً طبياً بالرعاية المركزة من نحو الأسبوع 22–24.',['ألم الظهر','حرقة المعدة','تشنجات الساقين'],['أجري سونار التشريح بين الأسبوع 18 و22.','أجري فحص سكر الحمل بين الأسبوع 24 و28.','نامي على جانبك ولاحظي حركة الجنين.']],
[35,'تنمو الرئتان وينتج الجنين مادة السرفاكتانت التي تساعده على التنفس بعد الولادة، ويزيد وزنه بنحو 200 غ أسبوعياً.',['ضيق النفس','تورم خفيف في القدمين','أرق وانقباضات براكستون هيكس'],['عدّي حركات الجنين يومياً.','خذي لقاح Tdap بين الأسبوع 27 و36 بعد استشارة الطبيب.','راجعي الطبيب فوراً عند صداع شديد أو تورم مفاجئ في الوجه.']],
[40,'من الأسبوع 37 يُعدّ الحمل مكتمل المدة، وفي الغالب ينزل رأس الجنين نحو الحوض استعداداً للولادة.',['ثقل الحوض وكثرة التبول','انقباضات براكستون هيكس','ألم الظهر وزيادة الإفرازات'],['أجري مسحة GBS بين الأسبوع 36 و37.','جهّزي حقيبة الولادة وخطة الوصول للمستشفى.','اذهبي للمستشفى عند انتظام الانقباضات أو نزول الماء أو النزيف.']]];
const FS=['🗓️|مرحلة الطمث وتجهيز الرحم|0|0','🥚|مرحلة الإباضة والتخصيب|0|0','🌱|مرحلة الانغراس وتكوين الخلايا|0.01|0','🍏|بذرة تفاح|0.1|0','🫘|حبة حمص|0.3|0','🫘|حبة فاصوليا صغيرة|0.6|0','🫐|توت أزرق|1|0','🍇|حبة عنب|1.6|1','🫒|حبة زيتون|2.3|2','🍓|حبة فراولة|3.1|4','🍈|تين|4.2|7','🍋|ليمونة صغيرة|5.4|14','🍑|خوخة صغيرة|7|23','🍋|ليمون أصفر|8.7|43','🍏|تفاحة صغيرة|10|70','🥑|أفوكادو|11.6|100','🧅|بصلة صغيرة|13|140','🥔|بطاطس متوسطة|14.2|190','🥭|مانجو|20|240','🍌|موزة|25.6|300','🥕|جزرة كبيرة|27|360','🥒|خيار|28|430','🥭|مانجو كبيرة|29|500','🌽|كوز ذرة|30|600','🥦|رأس بروكلي متوسط|34|660','🥬|رأس خس صغير|35.6|760','🥦|رأس قرنبيط|36.6|875','🍆|باذنجان|37.6|1000','🫑|فلفل رومي كبير|38.6|1150','🥬|ملفوف صغير|39.9|1300','🥥|ثمرة جوز الهند|41|1500','🍈|شمام كانتالوب|42.4|1700','🍍|ثمرة أناناس|43.7|2000','🍈|شمام كبير|45|2150','🎃|قرع صغير|46.2|2380','🥬|خس روماني كبير|47.4|2600','🥬|رأس ملفوف كامل|48.6|2850','🎃|قرع عسلي صغير|49.8|3100','🍉|بطيخة صغيرة|50.5|3250','🍉|بطيخة ناضجة|51|3400'];

const FACT=['بداية الدورة: يبدأ الحيض وتتجدد بطانة الرحم، ويُحسب عمر الحمل من أول يوم لآخر دورة، فلا يوجد حمل فعلي بعد.','تنضج بويضة داخل المبيض وتحدث الإباضة غالباً نحو اليوم 14، وتبقى البويضة قابلة للإخصاب 12–24 ساعة فقط.','ينقسم البويض المخصّب بسرعة ويصل الرحم على شكل كيسة أريمية ثم يبدأ الانغراس في بطانة الرحم.','ينغرس الجنين في بطانة الرحم ويبدأ هرمون الحمل hCG بالظهور في الدم والبول وتتكوّن المشيمة الأولى.','يبدأ الأنبوب العصبي بالتكوّن وهو أصل الدماغ والحبل الشوكي، ويتكوّن قلب بدائي على شكل أنبوب.','يبدأ القلب بالنبض بإيقاع منتظم ويمكن رؤيته بالسونار، وتظهر براعم الذراعين والساقين.','تتشكل ملامح الوجه الأولى (العينان والأنف) وينقسم الدماغ إلى مناطقه الرئيسية.','تتكوّن الأصابع وتبدأ حركات عفوية صغيرة، ويصل نبض القلب إلى نحو 150–170 نبضة في الدقيقة.','تتضح الجفون والأذنان وتنمو العضلات، وتبدأ الغضاريف بالتحول تدريجياً إلى عظام.','تنتهي مرحلة تكوّن الأعضاء الأساسية ويدخل الجنين مرحلة النمو، وتختفي الأغشية بين الأصابع.','يبدأ الجنين بتحريك أطرافه بنشاط، وتتكوّن الأظافر وتتمايز الأعضاء التناسلية الخارجية.','تعمل الكلى وتنتج البول، ويستجيب الجنين للمس، ويُجرى فحص الشفافية القفوية بين الأسبوع 11 و14.','تتكوّن بصمات الأصابع وتنمو الأحبال الصوتية، ويقترب نهاية الثلث الأول.','يبدأ الجنين بتعابير الوجه، ويغطي جلده شعر ناعم (اللانوغو)، وينشط جهازه الهضمي.','تقوى العظام وتتكوّن براعم التذوق، ويستطيع الجنين البلع والتحرك بحرية في السائل الأمنيوسي.','يكبر الهيكل العظمي وتتحسن حركات الجنين، وقد تشعر الأم بأولى الحركات خاصة إن سبق لها الحمل.','تتكوّن الدهون البنية التي تساعده على التدفئة بعد الولادة، وتنمو المشيمة بسرعة.','تتطور عظام الأذن الوسطى ويبدأ السمع، وتُغلَّف الأعصاب بغمد الميالين.','يغطي جلده طبقة دهنية واقية تسمى الفيرنكس تحميه من السائل الأمنيوسي.','منتصف الحمل: يُجرى سونار التشريح بين الأسبوع 18 و22 لفحص نمو الأعضاء.','تنشط حركات الجنين ويبدأ نخاع العظم بالمشاركة في إنتاج خلايا الدم.','تتكوّن الحواجب والرموش وتتطور حاسة اللمس، وقد يمسك الحبل السري بيديه.','يتفاعل مع الأصوات العالية ويتحرك استجابة لها، وتنمو الأوعية الدموية في رئتيه.','تتشكل الحويصلات الهوائية في async function bkSave(){
    const includeMedia = confirm('هل تريد تضمين الصور والمرفقات مع ألنسخة الاحتياطية؟\n(اضغط "إلغاء" لتنزيل البيانات النصية والزيارات فقط لتكون خفيفة وسريعة)');
    let media = [];
    if (includeMedia) {
        const ids = [];
        S.ps.forEach(p => p.visits.forEach(v => {
            (v.media || []).forEach(i => ids.push(i));
            (v.sonar || []).forEach(s => (s.media || []).forEach(i => ids.push(i)));
        }));
        for (const id of ids) {
            const m = await mget(id);
            if (m && m.blob.size < 10 * 1024 * 1024) {
                media.push({ id, name: m.name, type: m.type, b64: await b64(m.blob) });
            }
        }
    }
    try {
        const dataStr = JSON.stringify({ app: 'mahana', v: 2, S, media });
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mahana-backup-' + ymd(today()) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } catch (e) {
        alert('تعذر حفظ ألنسخة الاحتياطية.');
    }
}

async function bkLoad(f){

        if(!confirm('سيتم استبدال البيانات الحالية بالنسخة. متابعة؟'))return;
        for(const m of d.media||[]){
            const u8 = Uint8Array.from(atob(m.b64), c => c.charCodeAt(0));
            await mput({ id: m.id, blob: new Blob([u8], { type: m.type }), type: m.type, name: m.name });

        S = mkS(d.S);
        CH = [];
        save();
        alert('تمت استعادة ألنسخة الاحتياطية بنجاح!');
        draw();
    } catch(e) {
        alert('ملف النسخة غير صالح أو تالف.');
    }
}

$('#sh').innerHTML=`<div class='sheet'><div style='padding:8px'><div class='np row' style='margin-bottom:8px'><button class='btn' onclick='window.print()'>🖨️ طباعة / حفظ PDF</button><button class='btn g' onclick='closeSh()'>إغلاق</button></div><div class='pp'><h1>التقرير الطبي للحمل${S.ps.length>1?' — '+pn(S.cur):''}</h1><div>تاريخ التقرير: ${D(today())}</div><h2>ملخص الحمل</h2><table><tr><th>آخر يوم لآخر دورة</th><td>${S.lmp?D(pd(S.lmp)):'لم يحدد'}</td></tr><tr><th>الولادة المتوقعة</th><td>${D(p.due)}</td></tr><tr><th>عمر الحمل الحالي</th><td>${Math.max(0,p.w)} أسبوعاً و${Math.max(0,p.d)} أيام (${TR[trOf(w)].n})</td></tr><tr><th>حجم الجنين</th><td>بحجم ${r[1]} تقريباً${r[2]?'، الطول ≈ '+r[2]+' سم':''}</td></tr><tr><th>عدد الزيارات</th><td>${V.length}</td></tr></table><h2>تفاصيل الزيارات الطبية</h2>${vh||'<p>لا توجد زيارات مسجلة.</p>'}<div class='ft'>أُنشئ بتطبيق ماهانة. المعلومات للتوثيق والتثقيف ولا تغني عن استشارة الطبيب.</div></div></div></div>`}

function draw(){$('#app').innerHTML=[home,visits,sett][tab]();$('#nav').innerHTML=[['🏠','الرئيسية'],['🩺','الزيارات'],['⚙️','الإعدادات']].map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};draw();scrollTo(0,0)"><span>${t[0]}</span>${t[1]}</button>`).join('')}

let _pi=0,_pl='',_pc=0;
function pgRender(){const i=_pi,p=S.ps[i],pi=pregInfo(),w=Math.min(Math.max(pi.w,1),40),r=wk4(w),ds=new Set();let me=0,te=0,so=0,fl=0;
p.visits.forEach(v=>{if((v.doctor||'').trim())ds.add(v.doctor.trim());me+=(v.meds||[]).filter(m=>m.n).length;te+=(v.tests||[]).filter(t=>t.n).length;so+=(v.sonar||[]).length;fl+=(v.media||[]).length+(v.sonar||[]).reduce((a,s)=>a+(s.media||[]).length,0)});
const dt=p.visits.map(v=>v.date).sort(),ln=(a,b)=>`<div class='row sp' style='padding:6px 0;border-bottom:1px solid var(--ln)'><span class='mu'>${a}</span><b>${b}</b></div>`;
$('#sh').innerHTML=`<div class='sheet' onclick='if(event.target===this)closeSh()'><div><h2>🤰 ${pn(i)} (${i+1})</h2><div class='mu'>آخر يوم لآخر دورة</div><input type='date' value='${_pl}' oninput='_pl=this.value' style='margin-bottom:8px'>${ln('عمر الحمل الحالي',Math.max(0,pi.w)+' أسبوعاً و'+Math.max(0,pi.d)+' أيام')}${ln('المرحلة',TR[trOf(w)].n)}${ln('الولادة المتوقعة',D(pi.due))}${ln('حجم الجنين','بحجم '+r[1])}${ln('عدد الزيارات',p.visits.length)}${ln('عدد الأطباء',ds.size)}${ln('الأدوية والعلاجات',me)}${ln('التحاليل الطبية',te)}${ln('السونار',so)}${ln('الملفات المرفقة',fl)}${dt.length?ln('أول زيارة',dt[0])+ln('آخر زيارة',dt[dt.length-1]):''}<div class='row' style='margin-top:14px'><button class='btn' style='flex:1;padding:13px' onclick='pgSave()'>حفظ</button><button class='btn' style='flex:1;padding:13px;background:#c0394f' onclick='pgDel()'>${_pc?'تأكيد الحذف':'حذف'}</button></div>${_pc?`<div class='mu' style='margin-top:6px'>سيُحذف ${pn(i)} بكل زياراته وبياناته وملفاته نهائياً. اضغطي «تأكيد الحذف» للمتابعة.</div>`:''}</div></div>`}
function pgSheet(i){_pi=i;_pc=0;_pl=S.ps[i].lmp;pgRender()}
function pgSave(){S.ps[_pi].lmp=_pl;CH=[];save();closeSh();draw()}
function pgDel(){if(!_pc){_pc=1;pgRender();return}const i=_pi;S.ps[i].visits.forEach(v=>{(v.media||[]).forEach(mdel);(v.sonar||[]).forEach(s=>(s.media||[]).forEach(mdel))});
if(S.ps.length===1)S.ps[0]={lmp:'',visits:[]};else{S.ps.splice(i,1);S.cur=i<S.cur?S.cur-1:Math.min(S.cur,S.ps.length-1)}
CH=[];save();closeSh();draw()}
function setPreg(i){S.cur=i;CH=[];save();draw();pgSheet(i)}
function addPreg(){S.ps.push({lmp:'',visits:[]});S.cur=S.ps.length-1;CH=[];save();draw();pgSheet(S.cur)}
draw();
</script>
</body>
