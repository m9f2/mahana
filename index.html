<!DOCTYPE html>

    <style>
        *{box-sizing:border-box}:root{--bg:#1a1015;--card:#26171e;--tx:#f6e9ee;--mu:#b99aa6;--ac:#e86a92;--mar:#7a1f3d;--ln:#3a2530;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media(prefers-color-scheme:light){:root{--bg:#fdf3f6;--card:#fff;--tx:#3b1a27;--mu:#8a6573;--ln:#f0d9e1}}

        main{padding:14px;max-width:560px;margin:auto}h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:0 0 8px}
        .card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}.mu{color:var(--mu);font-size:13px;line-height:1.7}
        .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
        button,select,input,textarea{font:inherit;color:var(--tx)}.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer}.btn.g{background:transparent;border:1px solid var(--ln)}
        input,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;width:100%;text-align:right;}
        input[type="date"]{text-align:center;unicode-bidi:plaintext;}
        nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mu);font-size:11px}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
        .chip{display:inline-block;padding:6px 11px;margin:3px;border-radius:99px;border:1px solid var(--ln);font-size:13px;cursor:pointer}.chip.on{background:var(--mar);border-color:var(--ac)}
        .vis{border-inset-inline-start:3px solid var(--ln);padding:4px 10px;margin:6px 0}.vis.on{border-color:var(--ac)}
        .sheet{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end}.sheet>div{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:560px;margin:auto}
        .thumb{width:92px;height:92px;object-fit:cover;border-radius:10px;background:#000}ul{margin:4px 0;padding-inline-start:18px;line-height:1.9;font-size:14px}
        .pgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pgb{font:inherit;color:var(--tx);border:1px solid #ff5c9355;background:#ff5c9322;border-radius:12px;padding:13px;cursor:pointer}.pgb.on{background:#ff5c93;border-color:#ff5c93;color:#fff;font-weight:700}
        .fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:34px;line-height:1;border:0;box-shadow:0 6px 16px #0006;z-index:8;cursor:pointer}
        .pp{background:#fff;color:#222;padding:18px;border-radius:8px;line-height:1.7;font-size:14px}.pp h1{color:#7a1f3d;border-bottom:3px solid #e86a92;padding-bottom:6px;font-size:22px}.pp h2{color:#7a1f3d;border-bottom:1px solid #e0c3cd;padding-bottom:3px;margin-top:18px}.pp h3{color:#7a1f3d;margin:0 0 6px}.pp table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}.pp td,.pp th{border:1px solid #ddd;padding:5px 8px;text-align:right;vertical-align:top}.pp th{background:#f8e8ee}.pp .vb{border:1px solid #e0c3cd;border-radius:10px;padding:10px;margin:10px 0;page-break-inside:avoid}.pp .ft{font-size:11px;color:#777;margin-top:16px;border-top:1px solid #ddd;padding-top:6px}
        @media print{nav,.np,#app,.fab,#pv{display:none!important}.sheet{position:static;background:none;display:block}.sheet>div{max-height:none;overflow:visible;padding:0;max-width:none}body{background:#fff}}

<body>

<script>
const $=s=>document.querySelector(s);
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyD3yICQHDMTrrvCQVMnM8EaP-ESfR87J1yMLIx_h27kg6r7kUUrdBwwpCKunIxIpLC/exec";
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'],pn=i=>i<10?'الحمل '+ORD[i]:'الحمل رقم '+(i+1);
function mkS(r){const o={ps:r.ps&&r.ps.length?r.ps:[{lmp:'',visits:r.visits||[]}],cur:r.cur||0};o.ps.forEach(p=>{p.visits=p.visits||[]});if(o.cur>=o.ps.length)o.cur=0;
Object.defineProperty(o,'lmp',{get:()=>o.ps[o.cur].lmp,set:v=>{o.ps[o.cur].lmp=v}});Object.defineProperty(o,'visits',{get:()=>o.ps[o.cur].visits,set:v=>{o.ps[o.cur].visits=v}});return o}
let S;try{S=mkS(JSON.parse(localStorage.getItem('mahana')||'{}'))}catch(e){S=mkS({})}
const save=()=>{try{localStorage.setItem('mahana',JSON.stringify(S))}catch(e){}};
let tab=0;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{if(!d)return null;const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const D=d=>d?d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear():'لم يحدد بعد';

const TR=[{n:'الثلث الأول (1–13)',tips:['أكثري من السوائل وتناولي وجبات صغيرة متكررة لتخفيف الغثيان.'],meds:['حمض الفوليك (400–800 ميكروغرام يومياً عادةً).'],warn:['نزيف مهبلي أو ألم شديد بالبطن']},{n:'الثلث الثاني (14–27)',tips:['ممارسة المشي أو السباحة الخفيفة.'],meds:['مكمل الحديد إذا ظهر نقص في فحص الدم.'],warn:['صداع شديد مع تشوش الرؤية']},{n:'الثلث الثالث (28–40)',tips:['عدّي حركات الجنين يومياً.'],meds:['استمرار الحديد والكالسيوم.'],warn:['انخفاض أو توقف حركة الجنين']}];
const trOf=w=>w<14?0:w<28?1:2;

function pregInfo(){
    if(!S.lmp){return {days:0,w:0,d:0,due:null,left:280,unset:true};}
    const lmpDate = pd(S.lmp);
    if(!lmpDate || isNaN(lmpDate.getTime())){return {days:0,w:0,d:0,due:null,left:280,unset:true};}
    const diff = today() - lmpDate;
    const dd = Math.max(0, Math.floor(diff / 864e5));
    return {days:dd, w:Math.floor(dd/7), d:dd%7, due:add(lmpDate, 280), left:Math.max(0, 280-dd), unset:false};
}

const BD=[[8,'بداية تكوين الأعضاء الأساسية.',['غثيان وقيء صباحي'],['تناولي حمض الفوليك']],
[13,'تكتمل الأعضاء الأساسية.',['غثيان يخف تدريجياً'],['وجبات صغيرة متكررة']],
[19,'يبدأ الجنين بالبلع.',['عودة الطاقة وتحسّن الغثيان'],['خذي الحديد']],
[27,'يبدأ الجنين بسماع الأصوات.',['ألم الظهر وحرقة المعدة'],['أجري سونار التشريح']],
[35,'تنمو الرئتان.',['ضيق النفس وتورم خفيف'],['عدّي حركات الجنين']],
[40,'الحمل مكتمل المدة.',['ثقل الحوض'],['جهّزي حقيبة الولادة']]];
const FS=['🗓️|مرحلة الطمث|0|0','🥚|مرحلة الإباضة|0|0','🌱|مرحلة الانغراس|0.01|0','🍏|بذرة تفاح|0.1|0','🫘|حبة حمص|0.3|0','🫘|حبة فاصوليا|0.6|0','🫐|توت أزرق|1|0','🍇|حبة عنب|1.6|1','🫒|حبة زيتون|2.3|2','🍓|حبة فراولة|3.1|4','🍈|تين|4.2|7','🍋|ليمونة صغيرة|5.4|14','🍑|خوخة صغيرة|7|23','🍋|ليمون أصفر|8.7|43','🍏|تفاحة صغيرة|10|70','🥑|أفوكادو|11.6|100','🧅|بصلة صغيرة|13|140','🥔|بطاطس متوسطة|14.2|190','🥭|مانجو|20|240','🍌|موزة|25.6|300','🥕|جزرة كبيرة|27|360','🥒|خيار|28|430','🥭|مانجو كبيرة|29|500','🌽|كوز ذرة|30|600','🥦|رأس بروكلي|34|660','🥬|رأس خس صغير|35.6|760','🥦|رأس قرنبيط|36.6|875','🍆|باذنجان|37.6|1000','🫑|فلفل رومي|38.6|1150','🥬|ملفوف صغير|39.9|1300','🥥|جوز الهند|41|1500','🍈|شمام كانتالوب|42.4|1700','🍍|أناناس|43.7|2000','🍈|شمام كبير|45|2150','🎃|قرع صغير|46.2|2380','🥬|خس كبير|47.4|2600','🥬|ملفوف كامل|48.6|2850','🎃|قرع عسلي|49.8|3100','🍉|بطيخة صغيرة|50.5|3250','🍉|بطيخة ناضجة|51|3400'];
const FR=FS.map(s=>{const a=s.split('|');return[a[0],a[1],+a[2],+a[3]]}),EM=FR.map(x=>x[0]);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let _V,_U={},_nw=1;
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('mahana-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej()}});
async function mput(o){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(o);t.oncomplete=()=>r(1);t.onerror=()=>r(0)})}catch(e){return 0}}
async function mget(id){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function mdel(id){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
const fi=(k,ph,t)=>`<input ${t?`type="${t}"`:''} placeholder="${ph}" value="${esc(_V[k])}" oninput="_V.${k}=this.value" style="margin:3px 0">`;
const ri=(a,i,k,ph,fl)=>`<input placeholder="${ph}" value="${esc(_V[a][i][k])}" oninput="_V.${a}[${i}].${k}=this.value" style="flex:${fl}">`;
function zm(e){e.style.width=e.style.width?'':'100%';e.style.height=e.style.width?'auto':''}
async function addM(fs){let i=0;for(const f of fs){const id='m'+Date.now()+(i++);if(await mput({id,blob:f,type:f.type,name:f.name}))_V.media.push(id);else alert('تعذر حفظ الملف')}await rv()}
function xV(){if(!confirm('حذف هذه الزيارة وملفاتها؟'))return;(_V.sonar||[]).forEach(s=>s.media.forEach(mdel));_V.media.forEach(mdel);S.visits=S.visits.filter(x=>x.id!==_V.id);save();$('#sh').innerHTML='';draw()}
const sf=(i,k,ph,fl)=>`<input placeholder="${ph}" value="${esc(_V.sonar[i][k])}" oninput="_V.sonar[${i}].${k}=this.value" style="flex:${fl||1};min-width:0;margin:3px 0">`;
async function mth(ids,i){let h='';for(const id of ids){let u=_U[id];if(!u){const m=await mget(id);if(!m)continue;u=_U[id]={u:URL.createObjectURL(m.blob),v:(m.type||'').startsWith('video'),p:!/^(image|video)/.test(m.type||''),n:m.name}}
h+=`<div style="position:relative;display:inline-block;margin:3px">${u.p?`<a href="${u.u}" target="_blank" class="chip" style="display:flex;width:92px;height:92px;margin:0;align-items:center;justify-content:center;text-align:center;color:var(--tx);text-decoration:none;word-break:break-all;font-size:11px">📄 ${esc((u.n||'PDF').slice(0,18))}</a>`:u.v?`<video src="${u.u}" controls class="thumb"></video>`:`<img src="${u.u}" class="thumb" onclick="zm(this)">`}<span class="chip on" style="position:absolute;top:0;inset-inline-start:0;padding:0 7px;margin:0" onclick="dS2(${i},'${id}')">✕</span></div>`}return h}
async function sonH(){let h='<h2 style="margin-top:12px">🔊 السونار</h2>';for(let i=0;i<_V.sonar.length;i++){const s=_V.sonar[i];
h+=`<div class="card" style="padding:10px"><div class="row sp"><b>سونار ${i+1}</b><span onclick="dS(${i})">✕</span></div>${sf(i,'t','نوع السونار')}<div class="row">${sf(i,'crl','CRL مم')}${sf(i,'bpd','BPD مم')}${sf(i,'fl','FL مم')}</div><div class="row">${sf(i,'efw','الوزن غ')}${sf(i,'fhr','نبض الجنين')}</div><textarea rows="2" placeholder="تقرير السونار" oninput="_V.sonar[${i}].note=this.value">${esc(s.note)}</textarea><div>${await mth(s.media,i)}</div><input type="file" accept="image/*,video/*,application/pdf" multiple onchange="addS(${i},this.files)"></div>`}
return h+`<button class="btn g" onclick="_V.sonar.push({t:'',crl:'',bpd:'',fl:'',efw:'',fhr:'',af:'',plc:'',note:'',media:[]});rv()">+ سونار</button>`}
async function addS(i,fs){let n=0;for(const f of fs){const id='m'+Date.now()+(n++);if(await mput({id,blob:f,type:f.type,name:f.name}))_V.sonar[i].media.push(id);else alert('تعذر حفظ الملف')}await rv()}
function dS2(i,id){if(i<0)_V.media=_V.media.filter(x=>x!==id);else _V.sonar[i].media=_V.sonar[i].media.filter(x=>x!==id);mdel(id);rv()}
function dS(i){_V.sonar[i].media.forEach(mdel);_V.sonar.splice(i,1);rv()}
function closeSh(){$('#sh').innerHTML=''}
const wkOf=d=>S.lmp&&pd(d)?Math.floor((pd(d)-pd(S.lmp))/6048e5):'';
function pv0(){const o=$('#pv');if(o)o.remove()}
async function fileOpen(id){const m=await mget(id);if(!m)return;const t=m.type||'',n=esc(m.name||'ملف'),u=URL.createObjectURL(m.blob);let body;
if(t==='application/pdf'||t.startsWith('text/'))body=`<iframe src='${u}' style='flex:1;border:0;width:100%;background:#fff'></iframe>`;else if(t.startsWith('image'))body=`<div style='flex:1;overflow:auto;text-align:center'><img src='${u}' style='max-width:100%'></div>`;else if(t.startsWith('video'))body=`<video src='${u}' controls style='flex:1;width:100%;background:#000'></video>`;else body=`<div style='flex:1;padding:20px' class='mu'>لا يمكن معاينة الملف.</div>`;
let o=$('#pv');if(!o){o=document.createElement('div');o.id='pv';document.body.appendChild(o)}
o.style.cssText='position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column';
o.innerHTML=`<div class='row sp' style='padding:10px;border-bottom:1px solid var(--ln)'><b style='font-size:13px'>${n}</b><span class='row'><button class='btn' onclick='pv0()'>إغلاق</button></span></div>${body}`}
async function att(ids){let h='';for(const id of ids){const m=await mget(id);if(!m)continue;const t=m.type||'',n=esc(m.name||'ملف');h+=t.startsWith('image')?`<img src='${URL.createObjectURL(m.blob)}' data-i='${id}' onclick='fileOpen(this.dataset.i)' style='width:130px;height:130px;object-fit:cover;border:1px solid #ddd;margin:3px;border-radius:6px;cursor:pointer'>`:`<a data-i='${id}' onclick='fileOpen(this.dataset.i)' style='display:inline-block;border:1px solid #c9a0b0;background:#fbeef3;color:#7a1f3d;border-radius:6px;padding:6px 10px;margin:3px;font-size:12px;cursor:pointer'>📄 ${n}</a>`}return h?`<div style='margin-top:6px'><b>المرفقات:</b><br>${h}</div>`:''}
function sV(){if(!_V.date){alert('اختاري تاريخ الزيارة');return}const w=wkOf(_V.date);_V.week=w!==''&&w>=0?w:'';const i=S.visits.findIndex(x=>x.id===_V.id);i<0?S.visits.push(_V):S.visits[i]=_V;save();closeSh();draw()}

let CH=[],busy=0;
const RULES='أنتِ «مساعدة ماهانة»، مساعدة ذكية ناطقة بالعربية متخصصة في شؤون الحمل. تجيبين الحامل بناءً على بياناتها الفعلية المزودة أدناه (الزيارات، الأطباء، الأدوية، التحاليل والسونار). أجيبي بدقة وعناية وبصيغة المؤنث.';
function ctxTxt(){const p=pregInfo(),w=Math.min(Math.max(p.w,1),40),V=S.visits;
let t=`بيانات الحامل: أسبوع الحمل ${p.w}، عدد الزيارات: ${V.length}\n`;
V.forEach((v,k)=>{t+=`زيارة ${k+1}: التاريخ ${v.date}، الطبيب: ${v.doctor||'—'}، ملاحظات: ${v.notes||'—'}\n`});return t}

// الاتصال بـ Groq عبر الوسيط المجاني الخاص بك على Google Apps Script
async function ask(q){
    const inp=$('#cq');
    q=(q||(inp?inp.value:'')).trim();
    if(!q||busy)return;
    if(inp)inp.value='';
    busy=1;
    CH.push({role:'user',content:q});
    const box=$('#ch');
    box.innerHTML=chHTML()+`<div id='cb' class='mu'>جاري استشارة المساعدة الذكية عبر الوسيط…</div>`;
    box.scrollTop=box.scrollHeight;

    try {
        const response = await fetch(PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    {role: "system", content: RULES + "\n\n" + ctxTxt()},
                    ...CH.slice(-6).map(m => ({role: m.role, content: m.content}))
                ],
                temperature: 0.7
            })
        });

        const data = await response.json();
        if(data.choices && data.choices[0] && data.choices[0].message) {
            const replyText = data.choices[0].message.content;
            CH.push({role: 'assistant', content: replyText});
            box.innerHTML = chHTML();
        } else {
            throw new Error(data.error?.message || 'استجابة غير صالحة من الخادم');
        }
    } catch(e) {
        CH.pop();
        const b=$('#cb');
        if(b){
            b.className='mu';
            b.textContent='تعذّر الاتصال بالمساعد الذكي، تأكد من الاتصال أو إعدادات الوسيط.';
        }
    }
    busy=0;
}

function chHTML(){return CH.map(m=>`<div style='margin:6px 0'><div style='display:inline-block;max-width:94%;padding:8px 12px;border-radius:14px;background:${m.role==='user'?'var(--mar)':'var(--bg)'};border:1px solid var(--ln);white-space:pre-wrap;line-height:1.8'>${esc(m.content)}</div></div>`).join('')}

const aic=()=>`<div class='card'><h2>🤖 مساعدة الحمل الذكية (Groq AI)</h2><div class='mu'>اسأليها عن حملك، أعراضك، أطبائك، وزياراتك؛ مرتبطة مباشرة بسجلك عبر الوسيط الآمن.</div><div id='ch' style='max-height:340px;overflow:auto;margin:6px 0'>${chHTML()}</div><div>${['ما أعراضي الطبيعية هذا الأسبوع؟','لخّصي لي زياراتي وسوناراتي','ماذا أتوقع في هذا الشهر؟'].map(x=>`<span class='chip' onclick='ask(this.textContent)'>${x}</span>`).join('')}</div><div class='row' style='margin-top:8px'><input id='cq' placeholder='اكتبي سؤالك...' style='flex:1' onkeydown="if(event.key==='Enter')ask()"><button class='btn' onclick='ask()'>إرسال</button></div></div>`;
function dayChk(){const n=ymd(today());if(n!==_day){_day=n;if(!document.querySelector('.sheet')&&!document.getElementById('pv')&&!busy)draw()}}
let _day=ymd(today());setInterval(dayChk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayChk()});
function sett(){const p=pregInfo();return `<h1>⚙️ الإعدادات</h1><div class='card'><h2>وضع التتبع</h2><div class='pgs'>${S.ps.map((x,i)=>`<button class='pgb ${i===S.cur?'on':''}' onclick='setPreg(${i})'>🤰 ${pn(i)}</button>`).join('')}</div><button class='btn g' style='width:100%;padding:13px;margin-top:8px' onclick='addPreg()'>+ إضافة حمل جديد</button></div><div class='card'><h2>آخر يوم لآخر دورة · ${pn(S.cur)}</h2><input type='date' value='${S.lmp}' onchange='S.lmp=this.value;save();draw()'><div class='mu' style='margin-top:6px'>الولادة المتوقعة: ${D(p.due)} · الأسبوع ${Math.max(0,p.w)} و${Math.max(0,p.d)} أيام</div></div><div class='card'><h2>💾 النسخة الاحتياطية</h2><div class='row'><button class='btn' style='flex:1' onclick='bkSave()'>تنزيل نسخة</button><button class='btn g' style='flex:1' onclick='bkPick()'>استعادة نسخة</button></div><input id='rf' type='file' accept='.json,application/json' style='display:none' onchange='bkLoad(this.files[0])'></div>`}

function home(){
    const p=pregInfo();
    if(p.unset) {
        return `<h1>🤰 متابعة الحمل · ${pn(S.cur)}</h1><div class='card' style='text-align:center;padding:24px 14px;'><h2>مرحباً بكِ في ماهانة</h2><p class='mu' style='margin-bottom:16px;'>يرجى تحديد تاريخ أول يوم من آخر دورة شهرية.</p><input type='date' style='font-size:16px;padding:12px;margin-bottom:14px;' onchange='S.lmp=this.value;save();draw();'></div>${aic()}`;
    }
    const w=Math.min(Math.max(p.w,1),40),r=wk4(w),pr=Math.min(100,Math.max(0,p.days/280*100)),R=44,C=2*Math.PI*R,L=Math.max(0,p.left),m=Math.min(9,Math.floor(Math.max(0,p.days)/30.44)+1),sz=w<3?'':`الطول ≈ ${r[2]} سم`;
    return `<h1>🤰 متابعة الحمل${S.ps.length>1?' · '+pn(S.cur):''}</h1><div class='card row sp'><svg width='110' height='110' viewBox='0 0 110 110'><circle cx='55' cy='55' r='${R}' fill='none' stroke='var(--ln)' stroke-width='9'/><circle cx='55' cy='55' r='${R}' fill='none' stroke='var(--ac)' stroke-width='9' stroke-linecap='round' stroke-dasharray='${C*pr/100} ${C}' transform='rotate(-90 55 55)'/><text x='55' y='60' text-anchor='middle' fill='var(--tx)' font-size='18' font-weight='700'>${Math.round(pr)}%</text></svg><div style='flex:1'><div style='font-size:19px;font-weight:700'>الأسبوع ${p.w} و${p.d} أيام</div><div class='mu'>المتبقي: ${L} يوماً<br>الولادة: ${D(p.due)}</div></div></div><div class='card' style='text-align:center'><h2>حجم الجنين</h2><div style='font-size:80px'>${EM[w-1]}</div><div><b>${r[1]}</b></div><div class='mu'>${sz}</div></div>${aic()}<button class='fab np' onclick='editV()'>+</button>`
}

const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]||'');f.readAsDataURL(b)});
async function bkSave(){
    try {
        const dataStr = JSON.stringify({ app: 'mahana', v: 2, S });
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'mahana-backup-' + ymd(today()) + '.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
    } catch (e) { alert('تعذر حفظ النسخة الاحتياطية.'); }
}
function bkPick(){$('#rf').click()}
async function bkLoad(f){
    if(!f)return;
    try {
        const text = await f.text();
        const d = JSON.parse(text);
        if(d.app!=='mahana'||!d.S)throw new Error('ملف غير صالح');
        if(!confirm('سيتم استبدال البيانات الحالية بالنسخة. متابعة؟'))return;
        S = mkS(d.S); CH=[]; save();
        alert('تمت استعادة النسخة الاحتياطية بنجاح!'); draw();
    } catch(e) { alert('ملف النسخة غير صالح أو تالف.'); }
}

const wk4=w=>[w,FR[w-1][1],FR[w-1][2],FR[w-1][3]];
async function editV(id){const v=S.visits.find(x=>x.id===id);_nw=!v;_V=v?JSON.parse(JSON.stringify(v)):{id:'v'+Date.now(),date:ymd(today()),doctor:'',place:'',reason:'',notes:''};['meds','tests','sonar','media'].forEach(k=>_V[k]=_V[k]||[]);await rv()}
function addRow(a){_V[a].push(a==='meds'?{n:'',d:'',t:''}:{n:'',r:'',g:''});rv()}
function delRow(a,i){_V[a].splice(i,1);rv()}
async function rv(){const o=document.querySelector('.sheet>div'),y=o?o.scrollTop:0,sh=await sonH(),th=await mth(_V.media,-1);
$('#sh').innerHTML=`<div class='sheet' onclick='if(event.target===this)closeSh()'><div><h2>${_nw?'زيارة جديدة':'تفاصيل الزيارة'}</h2>${fi('date','التاريخ','date')}${fi('doctor','اسم الطبيب')}${fi('place','المستشفى')}${fi('reason','السبب')}<textarea rows='3' oninput='_V.notes=this.value'>${esc(_V.notes)}</textarea>${sh}<div class='row' style='margin-top:12px'><button class='btn' onclick='sV()'>حفظ</button><button class='btn g' onclick='closeSh()'>إغلاق</button></div></div></div>`;}
function visits(){const V=S.visits.slice().sort((a,b)=>a.date.localeCompare(b.date));
return `<h1>🩺 الزيارات الطبية</h1><div class='card row'><button class='btn' style='flex:1;padding:13px' onclick='editV()'>+ زيارة جديدة</button></div>${V.map(v=>`<div class='card'><b>${esc(v.date)}</b> - د. ${esc(v.doctor||'—')}</div>`).join('')||`<div class='card mu'>لا توجد زيارات.</div>`}`}
function draw(){$('#app').innerHTML=[home,visits,sett][tab]();$('#nav').innerHTML=[['🏠','الرئيسية'],['🩺','الزيارات'],['⚙️','الإعدادات']].map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};draw();scrollTo(0,0)"><span>${t[0]}</span>${t[1]}</button>`).join('')}

let _pi=0,_pl='',_pc=0;
function pgRender(){const i=_pi,p=S.ps[i],pi=pregInfo(),w=Math.min(Math.max(pi.w,1),40),r=wk4(w),ds=new Set();let me=0,te=0,so=0;
p.visits.forEach(v=>{if((v.doctor||'').trim())ds.add(v.doctor.trim());me+=(v.meds||[]).filter(m=>m.n).length;te+=(v.tests||[]).filter(t=>t.n).length;so+=(v.sonar||[]).length});
const dt=p.visits.map(v=>v.date).sort(),ln=(a,b)=>`<div class='row sp' style='padding:6px 0;border-bottom:1px solid var(--ln)'><span class='mu'>${a}</span><b>${b}</b></div>`;
$('#sh').innerHTML=`<div class='sheet' onclick='if(event.target===this)closeSh()'><div><h2>🤰 ${pn(i)} (${i+1})</h2><div class='mu'>آخر يوم لآخر دورة</div><input type='date' value='${_pl}' oninput='_pl=this.value' style='margin-bottom:8px'>${ln('عمر الحمل الحالي',Math.max(0,pi.w)+' أسبوعاً و'+Math.max(0,pi.d)+' أيام')}${ln('الولادة المتوقعة',D(pi.due))}${ln('عدد الزيارات',p.visits.length)}${ln('عدد الأطباء',ds.size)}${ln('الأدوية والعلاجات',me)}${ln('التحاليل الطبية',te)}${ln('السونار',so)}<div class='row' style='margin-top:14px'><button class='btn' style='flex:1;padding:13px' onclick='pgSave()'>حفظ</button><button class='btn' style='flex:1;padding:13px;background:#c0394f' onclick='pgDel()'>حذف</button></div></div></div>`;}
function pgSheet(i){_pi=i;_pc=0;_pl=S.ps[i].lmp;pgRender()}
function pgSave(){S.ps[_pi].lmp=_pl;CH=[];save();closeSh();draw()}
function pgDel(){if(!confirm('حذف هذا الحمل بكل زياراته؟'))return;if(S.ps.length===1)S.ps[0]={lmp:'',visits:[]};else{S.ps.splice(_pi,1);S.cur=_pi<S.cur?S.cur-1:Math.min(S.cur,S.ps.length-1)} CH=[];save();closeSh();draw()}
function setPreg(i){S.cur=i;CH=[];save();draw();pgSheet(i)}
function addPreg(){S.ps.push({lmp:'',visits:[]});S.cur=S.ps.length-1;CH=[];save();draw();pgSheet(S.cur)}
draw();
</script>
</body>
